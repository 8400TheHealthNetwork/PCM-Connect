server:
  host: "0.0.0.0"
  port: 8000
  shutdown_timeout_seconds: 30

pcm:
  base_url: "https://pcm-connectathon-mtls-4c336523aef82051.elb.il-central-1.amazonaws.com:4501"
  token_endpoint: "/token"
  introspect_endpoint: "/introspect"
  mtls_client: true
  client_assertion_algorithm: "RS256"
  # Optional logical audience for the client_assertion JWT. Set this when the
  # transport URL differs from PCM's public token URL (for example, when an
  # Istio egress gateway originates TLS for an internal HTTP connection).
  # Defaults to base_url + token_endpoint.
  client_assertion_audience: null
  # Machine-token scope requested from PCM. MOH production uses system/*.crus;
  # the MOH test environment currently requires an explicit override to
  # consent.read consent.write fhir.read.
  token_scope: "system/*.crus"
  # Connectathon server cert is CN=pcm-core, not the ELB hostname.
  # The chain is still verified against rootCA.crt; only SAN matching is skipped.
  verify_hostname: false
  # Per PCM API spec, /introspect accepts mutualTLS OR bearerAuth.
  # "bearer" → acquire adapter token via /token, send as Authorization: Bearer.
  # "mtls"   → rely on the mTLS connection alone, no Authorization header.
  introspect_auth_method: "bearer"

fhir_server:
  base_url: "https://fhir-internal:8080"
  protocol: "https"
  timeout_seconds: 30

id_replacement:
  base_url: "http://id-service:9000"
  endpoint: "/api/v1/resolve"
  timeout_seconds: 1.0
  retries: 3
  retry_backoff_seconds: 0.5

jwt:
  algorithm: "ES256"
  # Public URL of this adapter. MUST be the same value the FHIR server (IRIS)
  # is configured to trust as `iss`, AND the URL clients can hit to fetch
  # /.well-known/openid-configuration and /.well-known/jwks.json.
  # Override per environment with DS_ADAPTER_JWT_ISSUER.
  issuer: "ds-adapter"
  # JWT `aud` claim. Accepts a string OR a list of strings. Leave null to
  # fall back to fhir_server.base_url. Set to a list when the FHIR server
  # (e.g. IRIS) accepts more than one valid audience — for example with and
  # without an explicit port.
  # Override with DS_ADAPTER_JWT_AUDIENCE (use comma-separated for a list).
  # Example list:
  #   audience:
  #     - "https://iris.example.com:443/csp/healthshare/fhir1/fhir/r4"
  #     - "https://iris.example.com/csp/healthshare/fhir1/fhir/r4"
  audience: null
  expiry_seconds: 300

metadata:
  enabled: true
  # Override the JWKS URL advertised in discovery. Leave null to default to
  # `<issuer>/.well-known/jwks.json`.
  jwks_uri: null
  # Optional pass-through endpoints for clients that want them. Usually point
  # at PCM. Leave null to omit from the discovery payload.
  authorization_endpoint: null
  token_endpoint: null
  introspection_endpoint: null
  # `scopes_supported` defaults to a comprehensive SMART-on-FHIR list covering
  # the common resource types (with patient/*, user/*, system/* wildcards too)
  # since PCM baskets can grant access to many different resources. Override
  # in YAML if you need a tighter advertisement.
  capabilities:
    - "launch-standalone"
    - "client-public"

audit:
  enabled: true
  format: "json"
  include_response: false
  targets:
    stdout:
      enabled: false
    syslog:
      enabled: false
      host: "localhost"
      port: 514
      protocol: "udp"
    file:
      enabled: true
      path: "/var/log/adapter/audit.log"
      rotation: "daily"
      max_files: 30
    kafka:
      enabled: false
      brokers: "kafka:9092"
      topic: "ds-adapter-audit"

logging:
  level: "info"
  format: "json"

otel:
  enabled: true
  exporter: "otlp"
  endpoint: "http://otel-collector:4317"
  service_name: "ds-adapter"
  sample_rate: 1.0

# Trust identity headers produced by an AWS ALB in mTLS verify mode only when
# the application cannot be reached except through that trusted ingress path.
inbound_mtls:
  trust_aws_alb_headers: false

# Number of trusted proxies that append X-Forwarded-For between the caller and
# the application. Keep zero unless the network path is controlled end to end.
proxy_headers:
  trusted_hops: 0

verification:
  enabled: true
  forbidden_labels:
    - "http://fhir.health.gov.il/cs/il-core-main-security-label|V"
