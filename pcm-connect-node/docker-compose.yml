version: '3.8'

services:
  pcm-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcm-adapter
    ports:
      - "3009:3009"
    env_file:
      - .env
    environment:
      # Override with container-specific settings
      NODE_ENV: development
      PORT: 3009
    volumes:
      # Mount secrets directory read-only
      # Ensure ./secrets exists with required certificates before starting
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3009/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - pcm-network

networks:
  pcm-network:
    driver: bridge
